{% extends "base.html" %}

{% block title %}Check Your Email | UBCT Portal{% endblock %}

{% block content %}
<div class="ubct-form-page">
    <section class="ubct-card ubct-auth-card">
        <div class="ubct-card-body ubct-auth-message">
            <span class="ubct-auth-success-icon" aria-hidden="true">✓</span>
            <h1 class="ubct-title">Check your email</h1>
            <p class="ubct-subtitle">
                If an account matches that email address, password reset instructions have been sent.
                Please check your inbox and spam folder.
            </p>
            <a href="{% url 'account_login' %}" class="ubct-btn ubct-btn-secondary">
                Back to sign in
            </a>
        </div>
    </section>
</div>
{% endblock %}
