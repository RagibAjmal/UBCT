{% extends "base.html" %}

{% block title %}Password Updated | UBCT Portal{% endblock %}

{% block content %}
<div class="ubct-form-page">
    <section class="ubct-card ubct-auth-card">
        <div class="ubct-card-body ubct-auth-message">
            <span class="ubct-auth-success-icon" aria-hidden="true">✓</span>
            <h1 class="ubct-title">Password updated</h1>
            <p class="ubct-subtitle">Your password has been reset. You can now sign in with it.</p>
            <a href="{% url 'account_login' %}" class="ubct-btn ubct-btn-primary">
                Sign in
            </a>
        </div>
    </section>
</div>
{% endblock %}
